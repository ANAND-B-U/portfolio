<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Planner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #2d3748;
            margin-bottom: 6px;
        }

        .header p {
            color: #718096;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            color: #2d3748;
            transition: border-color 0.2s;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            display: none;
        }

        .checkbox-group label {
            font-weight: normal;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 25px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            color: #4a5568;
            transition: all 0.2s;
            margin: 0;
        }

        .checkbox-group input[type="checkbox"]:checked + label {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        .checkbox-group label:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .row {
            display: flex;
            gap: 16px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>✈️ AI Travel Planner</h1>
            <p>Plan your perfect India trip with AI + real hotel data</p>
        </div>

        <form action="/plan" method="POST">

            <div class="form-group">
                <label>📍 Destination</label>
                <input type="text" name="place" placeholder="e.g. Goa, Ooty, Mumbai" required>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>📅 Number of Days</label>
                    <input type="number" name="days" placeholder="e.g. 3" min="1" max="30" required>
                </div>
                <div class="form-group">
                    <label>💰 Budget (Rs.)</label>
                    <input type="number" name="budget" placeholder="e.g. 10000" required>
                </div>
            </div>

            <div class="form-group">
                <label>🎯 Select Your Interests</label>
                <div class="checkbox-group">
                    <div><input type="checkbox" name="interests" value="Nature & Hiking" id="c1"><label for="c1">🌿 Nature</label></div>
                    <div><input type="checkbox" name="interests" value="Beach" id="c2"><label for="c2">🏖️ Beach</label></div>
                    <div><input type="checkbox" name="interests" value="Food & Local Cuisine" id="c3"><label for="c3">🍛 Food</label></div>
                    <div><input type="checkbox" name="interests" value="History & Culture" id="c4"><label for="c4">🏛️ History</label></div>
                    <div><input type="checkbox" name="interests" value="Adventure Sports" id="c5"><label for="c5">🧗 Adventure</label></div>
                    <div><input type="checkbox" name="interests" value="Shopping" id="c6"><label for="c6">🛍️ Shopping</label></div>
                    <div><input type="checkbox" name="interests" value="Wildlife & Safari" id="c7"><label for="c7">🐘 Wildlife</label></div>
                    <div><input type="checkbox" name="interests" value="Temples & Spiritual" id="c8"><label for="c8">🛕 Temples</label></div>
                </div>
            </div>

            <button type="submit">🗺️ Generate My Travel Plan</button>

        </form>
    </div>
</body>
</html>
